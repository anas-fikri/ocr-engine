[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "photo-quality-engine"
version = "0.1.0"
description = "Deteksi kualitas foto (buram/pecah/gelap), kompresi dinamis, dan validasi keaslian untuk foto POD."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2",
  "pymysql>=1.1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4",
  "boto3>=1.34",
  "pillow>=10.4",
  "pillow-heif>=0.18",
  "opencv-python-headless>=4.10",
  "numpy>=1.26",
  "pyyaml>=6",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "prometheus-client>=0.20",
  "fpdf2>=2.7",
  "cryptography>=43",
  "zxing-cpp>=2.2",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.10"]
dev = ["pytest>=8", "moto[server]>=5", "ruff>=0.6"]

[project.scripts]
pqe = "engine.cli:main"

[tool.setuptools.packages.find]
include = ["engine*"]

[tool.setuptools.package-data]
engine = ["locales/*.yaml", "webui/*", "defaults/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "UP038"]
