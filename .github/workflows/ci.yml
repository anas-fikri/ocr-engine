name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install Tesseract (test keterbacaan teks)
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends tesseract-ocr tesseract-ocr-ind
      - name: Install
        run: |
          pip install -r requirements.lock
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check engine tests
      - name: Test
        run: pytest -q -p no:warnings

  clients:
    # Runtime dikunci ke versi security release 21 Okt 2026 (lihat clients/README.md)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {image: "node:22.23.4-alpine", cmd: "node --experimental-strip-types --no-warnings typescript/test.ts"}
          - {image: "node:24.22.1-alpine", cmd: "node --experimental-strip-types --no-warnings typescript/test.ts"}
          - {image: "php:8.3.36-cli", cmd: "php php/test.php"}
          - {image: "php:8.4.27-cli", cmd: "php php/test.php"}
    steps:
      - uses: actions/checkout@v5
      - name: Test client (${{ matrix.image }})
        run: docker run --rm -v "$PWD/clients:/c" -w /c ${{ matrix.image }} ${{ matrix.cmd }}

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t photo-quality-engine:ci .
      - name: Smoke test
        run: |
          docker run -d --name pqe -p 8000:8000 \
            -e DATABASE_URL=sqlite:////tmp/pqe.db -e AWS_ENDPOINT=http://127.0.0.1:1 \
            -e PQE_BOOTSTRAP_ADMIN_KEY=pqe_ci photo-quality-engine:ci pqe api
          for i in $(seq 1 30); do curl -fsS localhost:8000/healthz && break; sleep 1; done
          curl -fsS -H "X-API-Key: pqe_ci" localhost:8000/v1/me
          docker run --rm photo-quality-engine:ci sh -c "pqe synth-samples /tmp/s >/dev/null && pqe analyze /tmp/s/reject_dark.jpg"
