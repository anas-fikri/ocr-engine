apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pqe
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "30m"
spec:
  ingressClassName: nginx
  rules:
    - host: photo-quality.pcpexpress.com     # ganti sesuai domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: pqe-api, port: {name: http}}
  tls:
    - hosts: [photo-quality.pcpexpress.com]
      secretName: pqe-tls
