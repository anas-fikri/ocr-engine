# CONTOH. Jangan commit nilai asli. Buat dengan:
#   kubectl -n photo-quality create secret generic pqe-secrets \
#     --from-literal=DATABASE_URL='postgresql+psycopg://pqe:***@postgres-host:5432/pqe' \
#     --from-literal=AWS_ACCESS_KEY_ID='***' \
#     --from-literal=AWS_SECRET_ACCESS_KEY='***' \
#     --from-literal=PQE_BOOTSTRAP_ADMIN_KEY='pqe_***' \
#     --from-literal=PQE_S3_EVENT_TOKEN='***'
apiVersion: v1
kind: Secret
metadata:
  name: pqe-secrets
type: Opaque
stringData:
  DATABASE_URL: "postgresql+psycopg://pqe:CHANGE_ME@postgres:5432/pqe"
  AWS_ACCESS_KEY_ID: "CHANGE_ME"
  AWS_SECRET_ACCESS_KEY: "CHANGE_ME"
  PQE_BOOTSTRAP_ADMIN_KEY: "pqe_CHANGE_ME"
  PQE_S3_EVENT_TOKEN: "CHANGE_ME"
