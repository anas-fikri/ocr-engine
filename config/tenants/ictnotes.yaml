# Namespace modul dokumen invoice untuk ICTNotes v3 (ADR 0008). Tidak memantau bucket foto apa pun: tenant ini hanya
# dipakai sebagai namespace API key (job, file inbox, template issuer). API key-nya dibuat dengan:
#   pqe create-key --name ictnotes-prod --role app --tenant ictnotes --with-secret
# Referensi lengkap setiap field: docs/configuration.md

code: ictnotes
name: ICTNotes v3 (dokumen invoice)
default_lang: id
timezone: Asia/Jakarta
retention_days: 365
review_required: false
default_profile: default

sources: []
mapping: {}
sinks: []

profiles:
  default:
    mode: shadow
